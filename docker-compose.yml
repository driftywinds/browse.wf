services:
  browse-wf:
    #build:
    #  context: .
    #  # Multi-arch: docker buildx build --platform linux/amd64,linux/arm64 --push -t yourrepo/browse-wf .
    #  # Plain local build: docker compose up --build
    image: ghcr.io/driftywinds/browse-wf:latest
    container_name: browse-wf
    restart: unless-stopped
    ports:
      - "9092:80"
    volumes:
      # Persist the SQLite DB (user accounts + notification config + daemon state)
      # across container restarts and image updates. Create this dir on the host first:
      #   mkdir -p ./data && chown 33:33 ./data   (33 = www-data inside the container)
      - ./data:/data
    #healthcheck:
    #  test: ["CMD", "curl", "-f", "http://localhost/"]
    #  interval: 30s
    #  timeout: 10s
    #  retries: 3
    #  start_period: 10s

  # ── Apprise notification server ───────────────────────────────────────────
  # Set "Apprise Server URL" in the Notifications tab to: http://apprise:8000
  # browse-wf reaches it over the internal Docker network — no host port needed.
  #
  # To enable: uncomment the block below, then: docker compose up -d
  #
  # apprise:
  #   image: caronc/apprise:latest
  #   container_name: apprise
  #   restart: unless-stopped
  #   # Expose Apprise web UI on host (optional):
  #   # ports:
  #   #   - "8000:8000"
  #   # Persist Apprise server-side config (optional):
  #   # volumes:
  #   #   - apprise_config:/config

# volumes:
#   apprise_config:
